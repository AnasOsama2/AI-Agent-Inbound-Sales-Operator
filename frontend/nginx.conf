server {
    listen 80;
    root /usr/share/nginx/html;
    index index.html;
    client_max_body_size 21m;
    location /api/ {
        proxy_pass http://api:8000;
        proxy_buffering off;
        proxy_read_timeout 3600s;
        proxy_set_header Host $host;
    }
    location /health { proxy_pass http://api:8000; }
    location / { try_files $uri /index.html; }
}
