[project]
name = "salma"
version = "0.1.0"
description = "Grounded inbound assistant and inspection console"
requires-python = ">=3.14,<3.15"
dependencies = [
  "fastapi>=0.115,<1",
  "uvicorn>=0.34,<1",
  "sqlalchemy>=2.0,<3",
  "psycopg[binary]>=3.2,<4",
  "pydantic-settings>=2.8,<3",
  "httpx>=0.28,<1",
  "langgraph>=1,<2",
  "langsmith>=0.10,<1",
  "psutil>=7,<8",
  "pypdf>=6,<7",
  "alembic>=1.15,<2",
  "pgvector>=0.4,<1",
  "redis>=5,<7",
  "cryptography>=44",
  "python-multipart>=0.0.20",
  "openpyxl>=3.1,<4",
]

[project.optional-dependencies]
knowledge = ["sentence-transformers>=5,<6", "torch>=2.9"]
dev = ["pytest>=8,<10", "ruff>=0.12,<1"]

[tool.uv.sources]
torch = { index = "pytorch-cpu" }

[[tool.uv.index]]
name = "pytorch-cpu"
url = "https://download.pytorch.org/whl/cpu"
explicit = true

[tool.pytest.ini_options]
pythonpath = ["backend"]
testpaths = ["tests"]
addopts = "--basetemp=.pytest-tmp"

[tool.ruff]
line-length = 100
target-version = "py314"

[tool.ruff.lint]
select = ["E", "F", "I"]
